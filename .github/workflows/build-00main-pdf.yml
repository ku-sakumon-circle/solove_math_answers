name: Build 00main.pdf
run-name: Build 00main.pdf (${{ github.ref_name }})

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'Lim/**'
    paths-ignore:
      - pdf/00main.pdf
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-00main-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 00main.pdf
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          texlive_version: latest
          run: |
            cd main
            platex -synctex=1 -interaction=nonstopmode -file-line-error 00main.tex
            mendex 00main.idx
            platex -synctex=1 -interaction=nonstopmode -file-line-error 00main.tex
            dvipdfmx 00main.dvi
            test -f 00main.pdf

      - name: Place PDF in repository
        run: |
          mkdir -p pdf
          cp main/00main.pdf pdf/00main.pdf

      - name: Commit updated PDF
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update 00main.pdf [skip ci]'
          file_pattern: pdf/00main.pdf

      - name: Comment success on PR thread
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 1,
            });

            if (!pulls.length) {
              core.info(`No open PR found for branch ${branch}. Skip comment.`);
              return;
            }

            const issue_number = pulls[0].number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const githubPdfUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${branch}/pdf/00main.pdf`;

            const body = [
              'コンパイルテストに成功しました。',
              '',
              `- PDF（GitHub）: [00main.pdf](${githubPdfUrl})`,
              `- Workflow Run: [詳細ログを開く](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Workflow completed
        run: echo "Build workflow completed."
